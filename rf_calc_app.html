<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RF Calc">
<meta name="theme-color" content="#eef0ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>RF/Microwave Calculator</title>
<style>
:root{
  --bg:#eef0ec; --panel:#fbfcfa; --ink:#18202a; --muted:#66707c; --faint:#9aa2a9;
  --line:#e2e5e0; --line2:#cdd3cc; --well:#f3f5f1;
  --trace:#0a7c86; --trace-ink:#075e66; --trace-soft:#e2f1f0;
  --red:#d4372f; --cu:#b8732f; --sub:#ebe5d1; --subs:#d3c8a6;
  --math:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--trace);outline-offset:2px}

.screen{display:none}
.screen.active{display:block}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;padding:40px 20px 26px;border-bottom:1px solid var(--line)}
.hero svg.trace{position:absolute;left:0;right:0;bottom:6px;width:100%;height:110px;pointer-events:none}
.hero svg.trace path{fill:none;stroke:var(--trace);stroke-width:1.6;opacity:.38;stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.6s ease-out .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hero svg.trace path{animation:none;stroke-dashoffset:0}}
.hero-in{position:relative;max-width:680px;margin:0 auto}
.hero h1{font-family:var(--math);font-size:31px;line-height:1.1;font-weight:600;letter-spacing:-.01em}
.hero p{margin-top:6px;font-size:13.5px;color:var(--muted)}
.home{max-width:680px;margin:0 auto;padding:6px 14px 40px}
.group h2{font-size:14px;font-weight:650;color:var(--ink);margin:22px 6px 8px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:13px;padding:12px 14px;cursor:pointer;user-select:none}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--well)}
@media (hover:hover){.item:hover{background:var(--well)}}
.badge{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-family:var(--math);font-size:16px;font-weight:600}
.bc{background:#e2f1f0;color:#075e66}
.bk{background:#f3e8d8;color:#8a5216}
.bs{background:#e6e9f4;color:#33417a}
.item .t{font-size:15px;font-weight:600}
.item .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.item .chev{margin-left:auto;color:var(--faint);font-size:22px;line-height:1}
.foot{text-align:center;font-size:12px;color:var(--faint);margin-top:26px}

/* ---------- calculator chrome ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:4px;padding:10px 12px;background:rgba(238,240,236,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;font-weight:650}
.back{width:36px;height:36px;border:0;background:none;color:var(--trace);font-size:30px;line-height:1;cursor:pointer;border-radius:8px}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 44px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px 10px;margin-bottom:12px}
.card h3{font-size:13.5px;font-weight:650;margin:2px 0 4px}
.rows+.rows{border-top:2px solid var(--line2);margin-top:6px;padding-top:4px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 116px 64px;align-items:center;gap:8px;padding:7px 0}
.rows .row+.row{border-top:1px solid var(--line)}
.gl{font-size:12px;font-weight:600;color:var(--muted);padding:8px 0 2px}
.lbl{font-family:var(--math);font-size:16.5px;line-height:1.05;color:var(--ink)}
.lbl sub{font-size:.66em}
.lbl small{display:block;font-family:var(--sans);font-size:10px;color:var(--faint);margin-top:2px}
.nm{font-size:12.5px;color:var(--muted);line-height:1.3}
.u{position:relative;font-size:12.5px;color:var(--muted)}
.u sub{font-size:.75em}
.iw{position:relative}
input.num,input.out{width:100%;height:40px;font:500 14.5px var(--mono);text-align:right;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s,background-color .12s}
input.num:focus{border-color:var(--trace);box-shadow:0 0 0 3px rgba(10,124,134,.15)}
input.num.dirty{border-color:var(--red);box-shadow:0 0 0 3px rgba(212,55,47,.13)}
input.num.computed{background:var(--trace-soft);color:var(--trace-ink);border-color:#bfe0dd}
input.out{background:var(--well);border-color:var(--line);cursor:default}
.pm{display:none;position:absolute;left:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:6px;background:#e9ece6;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
@media (pointer:coarse){.iw.sg .pm{display:block}.iw.sg input.num{padding-left:40px}}

/* dropdown */
.dd{position:relative}
.ddb{width:100%;height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--well);color:var(--ink);font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 4px}
.ddb i{font-style:normal;font-size:9px;color:var(--muted)}
.ddm{display:none;position:absolute;right:0;top:calc(100% + 4px);min-width:100%;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 28px rgba(24,32,42,.14);z-index:90;overflow:hidden}
.dd.open .ddm{display:block}
.ddm div{padding:10px 12px;font-size:13px;text-align:center;cursor:pointer}
.ddm div:hover{background:var(--trace-soft)}
.ddm div.on{font-weight:700;color:var(--trace-ink)}

/* segmented */
.seg{display:flex;gap:3px;background:#e6e9e3;border-radius:10px;padding:3px;margin:4px 0 10px}
.seg button{flex:1;height:34px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(24,32,42,.1)}
.seg.sm{width:180px;margin-left:auto}
.seg.sm button{height:28px;font-size:12px}
.dia{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:6px;display:flex;justify-content:center}
.dia svg{width:100%;max-width:330px;height:auto;display:block}

/* actions */
.err{min-height:18px;font-size:12.5px;color:var(--red);margin:0 4px 8px}
.actions{display:flex;gap:10px}
.btn{flex:1;height:46px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--trace);border-color:var(--trace);color:#fff}
.btn:active{transform:translateY(1px)}
.hint{display:none;font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.hint kbd{font:600 10.5px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff;color:var(--ink)}
@media (hover:hover) and (pointer:fine){.hint.k{display:block}}
@media (pointer:coarse){.hint.t{display:block}}
.fx{margin-top:16px;padding:12px 14px;border-left:3px solid var(--trace);background:var(--well);border-radius:0 10px 10px 0;font:12px/1.85 var(--mono);color:#4f5864;overflow-x:auto}
.fx sub,.fx sup{font-size:.75em}
.note{font-size:12.5px;color:var(--muted);padding:6px 0 2px}

/* cascade */
.st{border:1px solid var(--line);border-radius:10px;padding:6px 10px 10px;margin:8px 0;background:#fff}
.sth{display:flex;justify-content:space-between;align-items:center}
.sn{font-size:12.5px;font-weight:650;color:var(--ink)}
.sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sg span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.st input.num{height:38px;font-size:13.5px;padding:0 8px}
@media (pointer:coarse){.st .iw.sg input.num{padding-left:38px}}
@media (max-width:520px){.sg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sx{width:30px;height:30px;border:0;border-radius:7px;background:none;color:var(--faint);font-size:19px;cursor:pointer}
.sx:hover{background:var(--well);color:var(--red)}
.add{width:100%;height:38px;margin:6px 0 4px;border:1.5px dashed var(--line2);border-radius:9px;background:none;color:var(--trace-ink);font-size:13px;font-weight:600;cursor:pointer}

/* L-match solutions */
.sol{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-top:10px;background:#fff}
.solh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.solh b{font-size:13.5px}
.solh span{font-size:12px;color:var(--trace-ink);font-weight:600}
.solo{font-size:11.5px;color:var(--muted);margin-top:2px}
.sol svg{width:100%;max-width:330px;display:block;margin:6px auto 8px}
.solv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.solv div{background:var(--well);border-radius:8px;padding:8px 10px}
.solv span{display:block;font-size:11.5px;color:var(--muted)}
.solv b{font:600 15px var(--mono)}
.solv em{display:block;font:normal 11px var(--mono);color:var(--muted);margin-top:2px}

/* svg */
.sv .w{stroke:#323a46;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sv .rb{fill:#fff;stroke:#323a46;stroke-width:1.6}
.sv .dt{fill:#323a46}
.sv .pt{fill:#fff;stroke:#323a46;stroke-width:1.4}
.sv .dm{stroke:#6c7480;stroke-width:1}
.sv .tx{font-family:var(--math);font-style:italic;font-size:14px;fill:#323a46}
.sv .tx.s{font-family:var(--sans);font-style:normal;font-size:10px;fill:#6c7480}
.sv .tx.m{fill:#8f7f52;font-size:13px}
.sv .tx.v{font-family:var(--mono);font-style:normal;font-size:11px;font-weight:600;fill:var(--trace-ink)}

@media (max-width:400px){
  .row{grid-template-columns:44px minmax(0,1fr) 106px 60px;gap:7px}
  .card{padding:10px 12px 8px}
  .wrap{padding:12px 10px 40px}
  .lbl{font-size:15.5px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const LOG10 = Math.log10, PI = Math.PI, C0 = 299792458, KB = 1.380649e-23, ETA0 = 376.730313668;

/* ================= number formatting ================= */
function trim(s){ if(s.indexOf('.')<0) return s+'.0'; s=s.replace(/0+$/,''); return s.endsWith('.')?s+'0':s; }
function fmt(v){
  if(v===Infinity) return '∞';
  if(v===-Infinity) return '−∞';
  if(typeof v!=='number'||!isFinite(v)) return '';
  if(Object.is(v,-0)) v=0;
  const a=Math.abs(v);
  if(a!==0&&(a<0.01||a>=1e6)){ const p=v.toExponential(3).split('e'); return trim(p[0])+'e'+p[1].replace('+',''); }
  return trim(v.toFixed(3));
}
function fmtSI(v,u){
  if(!isFinite(v)) return '';
  if(v===0) return '0.0 '+u;
  const P=[[1e-15,'f'],[1e-12,'p'],[1e-9,'n'],[1e-6,'µ'],[1e-3,'m'],[1,''],[1e3,'k'],[1e6,'M'],[1e9,'G']];
  const a=Math.abs(v); let p=P[0];
  for(const q of P) if(a>=q[0]*0.9995) p=q;
  return trim((v/p[0]).toFixed(3))+' '+p[1]+u;
}
const clean=(v,ref)=>Math.abs(v)<1e-9*ref?0:v;

/* ================= units ================= */
const UNITS={
  freq:[['GHz',1e9],['MHz',1e6],['kHz',1e3],['Hz',1]],
  time:[['ps',1e-12],['ns',1e-9],['µs',1e-6],['ms',1e-3],['s',1]],
  len:[['mm',1e-3],['cm',1e-2],['m',1]],
  dist:[['m',1],['km',1e3],['mi',1609.344],['nmi',1852]],
  ind:[['nH',1e-9],['µH',1e-6],['mH',1e-3],['H',1]],
  cap:[['pF',1e-12],['nF',1e-9],['µF',1e-6],['mF',1e-3]],
  jit:[['fs',1e-15],['ps',1e-12],['ns',1e-9]]
};
const UIDX={}, DDEL={};

/* ================= value access ================= */
function raw(id){ const el=$(id); return el?el.value.trim().replace(/,/g,'.').replace(/−/g,'-'):''; }
const has=id=>raw(id)!=='';
function num(id){ const s=raw(id); return s===''?NaN:Number(s); }
function factor(id){ const el=DDEL[id]; return el?UNITS[el.dataset.units][UIDX[id]][1]:1; }
const getSI=id=>num(id)*factor(id);
function put(id,v){ const el=$(id); el.value=fmt(v/factor(id)); if(el.classList.contains('num')){ el.classList.add('computed'); el.classList.remove('dirty'); } }
function putX(src,map){ for(const k in map) if(k!==src) put(k,map[k]); }
function wipe(ids){ ids.forEach(id=>{ const el=$(id); if(el){ el.value=''; el.classList.remove('computed'); } }); }

/* ================= edit order (which field is the source) ================= */
const ORDER={};
function lastEd(sc,ids){ const o=ORDER[sc]||[]; for(let i=o.length-1;i>=0;i--) if(ids.includes(o[i])) return o[i]; return null; }
function target(sc,ids){
  const f=ids.filter(has);
  if(f.length<ids.length-1) return {err:`Enter any ${ids.length-1} of the ${ids.length} values.`};
  if(f.length===ids.length-1) return {t:ids.find(i=>!has(i))};
  const o=ORDER[sc]||[]; let best=ids[0], r=Infinity;
  ids.forEach(i=>{ const k=o.indexOf(i); if(k<r){ r=k; best=i; } });
  return {t:best};
}

/* ================= markup builders ================= */
function iw(id,o){
  o=o||{}; const out=!!o.out;
  const attrs=out?' readonly tabindex="-1"':' inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"';
  const val=o.val!=null?` value="${o.val}" data-default="${o.val}"`:'';
  return `<div class="iw${o.signed?' sg':''}"><input id="${id}" class="${out?'out':'num'}"${attrs}${val}>${o.signed?'<button type="button" class="pm" tabindex="-1" aria-label="Toggle sign">±</button>':''}</div>`;
}
function row(sym,name,id,o){
  o=o||{};
  const unit=o.dd?`<div class="dd" data-for="${id}" data-units="${o.dd}" data-def="${o.def||0}"></div>`:`<span${o.uc?` class="${o.uc}"`:''}>${o.unit||''}</span>`;
  return `<div class="row"${o.tl?` data-tl="${o.tl}"`:''}><div class="lbl"${o.lid?` id="${o.lid}"`:''}>${sym}${o.sub?`<small>${o.sub}</small>`:''}</div><div class="nm"${o.nid?` id="${o.nid}"`:''}>${name}</div>${iw(id,o)}<div class="u">${unit}</div></div>`;
}
const rows=(...r)=>`<div class="rows">${r.join('')}</div>`;
const card=(t,b)=>`<div class="card">${t?`<h3>${t}</h3>`:''}${b}</div>`;
const gl=t=>`<div class="gl">${t}</div>`;
const seg=(id,items,cls)=>`<div class="seg${cls?' '+cls:''}" id="${id}">${items.map(([v,l],i)=>`<button type="button" data-v="${v}"${i===0?' class="on"':''}>${l}</button>`).join('')}</div>`;

/* ================= svg helpers ================= */
const L_=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="w"/>`;
const T_=(x,y,s,a,c)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}" class="${c||'tx'}">${s}</text>`;
const RC=(x,y,w,h,f,s)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${s?` stroke="${s}"`:''}/>`;
const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="2.6" class="dt"/>`;
const port=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.2" class="pt"/>`;
function hdim(x1,x2,y,l){ return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="dm"/><line x1="${x1}" y1="${y-4}" x2="${x1}" y2="${y+4}" class="dm"/><line x1="${x2}" y1="${y-4}" x2="${x2}" y2="${y+4}" class="dm"/>`+T_((x1+x2)/2,y-6,l); }
function vdim(x,y1,y2,l){ return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" class="dm"/><line x1="${x-4}" y1="${y1}" x2="${x+4}" y2="${y1}" class="dm"/><line x1="${x-4}" y1="${y2}" x2="${x+4}" y2="${y2}" class="dm"/>`+T_(x+9,(y1+y2)/2+5,l,'start'); }
function resH(x1,x2,y){ return `<rect x="${x1}" y="${y-7}" width="${x2-x1}" height="14" rx="2" class="rb"/>`; }
function resV(x,y1,y2){ return `<rect x="${x-7}" y="${y1}" width="14" height="${y2-y1}" rx="2" class="rb"/>`; }
function indH(x1,x2,y){ const r=(x2-x1)/8; let d=`M${x1} ${y}`; for(let i=0;i<4;i++) d+=` a${r} ${r} 0 0 1 ${2*r} 0`; return `<path d="${d}" class="w"/>`; }
function indV(x,y1,y2){ const r=(y2-y1)/8; let d=`M${x} ${y1}`; for(let i=0;i<4;i++) d+=` a${r} ${r} 0 0 1 0 ${2*r}`; return `<path d="${d}" class="w"/>`; }
function capH(x1,x2,y){ const c=(x1+x2)/2; return L_(x1,y,c-4,y)+L_(c+4,y,x2,y)+L_(c-4,y-10,c-4,y+10)+L_(c+4,y-10,c+4,y+10); }
function capV(x,y1,y2){ const c=(y1+y2)/2; return L_(x,y1,x,c-4)+L_(x,c+4,x,y2)+L_(x-10,c-4,x+10,c-4)+L_(x-10,c+4,x+10,c+4); }

const CU='#b8732f', SUB='#ebe5d1', SUBS='#d3c8a6';
const SVG_TL={
  ms:`<svg viewBox="0 0 280 108" class="sv">${RC(20,50,220,40,SUB,SUBS)}${RC(20,90,220,7,CU)}${RC(110,42,40,8,CU)}${hdim(110,150,30,'W')}${vdim(252,50,90,'h')}${T_(156,48,'t','start')}${T_(130,77,'ε<tspan font-size="10" dy="3">r</tspan>','middle','tx m')}</svg>`,
  cpwg:`<svg viewBox="0 0 280 108" class="sv">${RC(20,50,220,40,SUB,SUBS)}${RC(20,90,220,7,CU)}${RC(20,42,82,8,CU)}${RC(118,42,44,8,CU)}${RC(178,42,62,8,CU)}${RC(46,50,5,40,CU+'88')}${RC(76,50,5,40,CU+'88')}${RC(199,50,5,40,CU+'88')}${RC(226,50,5,40,CU+'88')}${hdim(118,162,30,'W')}${hdim(162,178,30,'S')}${vdim(252,50,90,'h')}${T_(140,77,'ε<tspan font-size="10" dy="3">r</tspan>','middle','tx m')}</svg>`,
  sl:`<svg viewBox="0 0 280 108" class="sv">${RC(20,12,220,6,CU)}${RC(20,18,220,72,SUB,SUBS)}${RC(20,90,220,6,CU)}${RC(110,52,40,6,CU)}${hdim(110,150,42,'W')}${vdim(252,18,90,'b')}${T_(156,60,'t','start')}${T_(130,80,'ε<tspan font-size="10" dy="3">r</tspan>','middle','tx m')}</svg>`
};
function svgAtt(t){
  const yT=28,yB=88; let s='';
  if(t==='pi'){
    s+=L_(20,yT,112,yT)+resH(112,168,yT)+L_(168,yT,260,yT)+L_(20,yB,260,yB);
    [70,210].forEach(x=>{ s+=L_(x,yT,x,44)+resV(x,44,72)+L_(x,72,x,yB)+dot(x,yT)+dot(x,yB)+T_(x+12,63,'R<tspan font-size="10" dy="3">1</tspan>','start'); });
    s+=T_(140,15,'R<tspan font-size="10" dy="3">2</tspan>');
  } else {
    s+=L_(20,yT,56,yT)+resH(56,100,yT)+L_(100,yT,180,yT)+resH(180,224,yT)+L_(224,yT,260,yT)+L_(20,yB,260,yB)
      +L_(140,yT,140,44)+resV(140,44,72)+L_(140,72,140,yB)+dot(140,yT)+dot(140,yB)
      +T_(78,15,'R<tspan font-size="10" dy="3">1</tspan>')+T_(202,15,'R<tspan font-size="10" dy="3">1</tspan>')+T_(152,63,'R<tspan font-size="10" dy="3">2</tspan>','start');
  }

  fx:'Z = Z₀·(1 + Γ)/(1 − Γ)<br>Γ = (Z − Z₀)/(Z + Z₀)<br>S<sub>11</sub> = 20·log|Γ|',

const TL={type:'ms',unit:0};

const DIMIDS=['tl_h','tl_t','tl_s','tl_w','tl_len','tl_lg','tl_lq'];
function Kell(k){ let a=1,b=Math.sqrt(1-k*k); for(let i=0;i<40;i++){ const an=(a+b)/2; b=Math.sqrt(a*b); a=an; if(Math.abs(a-b)<1e-15) break; } return PI/(2*a); }
const KK=k=>Kell(k)/Kell(Math.sqrt(1-k*k));
function msZ(W,h,t,er){
  const u=W/h, tn=t/h; let u1=u, ur=u;
  if(tn>0){ const c=1/Math.tanh(Math.sqrt(6.517*u)); const du1=(tn/PI)*Math.log(1+4*Math.E/(tn*c*c)); const dur=0.5*(1+1/Math.cosh(Math.sqrt(er-1)))*du1; u1=u+du1; ur=u+dur; }
  const Z01=x=>ETA0/(2*PI)*Math.log((6+(2*PI-6)*Math.exp(-Math.pow(30.666/x,0.7528)))/x+Math.sqrt(1+4/(x*x)));
  const ee=x=>{ const a=1+Math.log((x**4+(x/52)**2)/(x**4+0.432))/49+Math.log(1+(x/18.1)**3)/18.7; const b=0.564*Math.pow((er-0.9)/(er+3),0.053); return (er+1)/2+(er-1)/2*Math.pow(1+10/x,-a*b); };
  const eur=ee(ur); return {z:Z01(ur)/Math.sqrt(eur),e:eur*(Z01(u1)/Z01(ur))**2};
}
function slZ(W,b,t,er){
  const x=t/b, bt=b-t; let dW=0;
  if(x>0){ const n=2/(1+(2/3)*x/(1-x)); dW=bt*(x/(PI*(1-x)))*(1-0.5*Math.log((x/(2-x))**2+Math.pow(0.0796*x/(W/b+1.1*x),n))); }
  const m=bt/(W+dW);
  return {z:30/Math.sqrt(er)*Math.log(1+(4/PI)*m*((8/PI)*m+Math.sqrt(((8/PI)*m)**2+6.27))),e:er};
}
function cpwZ(W,h,S,er){
  const k=W/(W+2*S), k1=Math.tanh(PI*W/(4*h))/Math.tanh(PI*(W+2*S)/(4*h));
  const r=KK(k), r1=KK(k1), q=r1/r, e=(1+er*q)/(1+q);

function tlz(W,h,t,S,er){ return TL.type==='ms'?msZ(W,h,t,er):TL.type==='sl'?slZ(W,h,t,er):cpwZ(W,h,S,er); }

  let lo=Math.log(h*1e-4), hi=Math.log(h*1e3);
  const z=w=>tlz(Math.exp(w),h,t,S,er).z;
  if(!(Zt<=z(lo)&&Zt>=z(hi))) return null;
  for(let i=0;i<120;i++){ const m=(lo+hi)/2; if(z(m)>Zt) lo=m; else hi=m; }
  return Math.exp((lo+hi)/2);
}

      rows(row('<i>R</i><sub>S</sub>','Source resistance','lm_rs',{val:'50',unit:'Ω'}))
      + rows(row('<i>R</i><sub>L</sub>','Load resistance','lm_rl',{unit:'Ω'}),
             row('<i>X</i><sub>L</sub>','Load reactance','lm_xl',{signed:1,unit:'Ω'}))
      + rows(row('<i>f</i>','Frequency','lm_f',{dd:'freq',def:1})))
    + `<div id="lm_sol"></div>`,
  fx:'Series X &gt; 0 → L = X/ω, X &lt; 0 → C = −1/(ωX)<br>Shunt B &gt; 0 → C = B/ω, B &lt; 0 → L = −1/(ωB)<br>ω = 2πf',
  clear(){ $('lm_sol').innerHTML=''; },
  calc(){
    const Rs=num('lm_rs'); if(!(Rs>0)) return 'Source resistance must be greater than 0.';
    const RL=num('lm_rl'); if(!(RL>0)) return 'Load resistance must be greater than 0.';
    const XL=has('lm_xl')?num('lm_xl'):0; if(!isFinite(XL)) return 'Enter a valid load reactance.';
    const f=getSI('lm_f'); if(!(f>0)) return 'Enter a frequency.';
    const w=2*PI*f, Z0=Rs;
    if(Math.abs(RL-Z0)<1e-9*Z0&&Math.abs(XL)<1e-9*Z0){ $('lm_sol').innerHTML=card('Solutions','<p class="note">The load already equals the source resistance. No network is needed.</p>'); return true; }
    let cand=[];
    const dA=RL*RL+XL*XL-Z0*RL;
    if(dA>=0){
      const sq=Math.sqrt(RL/Z0)*Math.sqrt(dA);
      [1,-1].forEach(sg=>{
        const B=(XL+sg*sq)/(RL*RL+XL*XL);
        if(Math.abs(B)<1e-15) cand.push({sf:false,X:-XL,B:0});
        else cand.push({sf:false,X:1/B+XL*Z0/RL-Z0/(B*RL),B});
      });
    }
    if(RL<Z0){
      const b=Math.sqrt((Z0-RL)/RL)/Z0, x=Math.sqrt(RL*(Z0-RL));
      [1,-1].forEach(sg=>cand.push({sf:true,X:sg*x-XL,B:sg*b}));
    }
    const seen=new Set(), sols=[];
    cand.forEach(c=>{
      c.X=clean(c.X,Z0); c.B=clean(c.B,1/Z0);
      let Zin;
      if(!c.sf){ const y=cinv([RL,XL]); const z=cinv([y[0],y[1]+c.B]); Zin=[z[0],z[1]+c.X]; }
      else { const y=cinv([RL,XL+c.X]); Zin=cinv([y[0],y[1]+c.B]); }
      if(Math.hypot(Zin[0]-Z0,Zin[1])>1e-6*Z0) return;
      const key=c.sf+'|'+c.X.toPrecision(6)+'|'+c.B.toPrecision(6);
      if(!seen.has(key)){ seen.add(key); sols.push(c); }
    });
    const elS=X=>X===0?null:(X>0?{t:'L',v:X/w}:{t:'C',v:-1/(w*X)});
    const elP=B=>B===0?null:(B>0?{t:'C',v:B/w}:{t:'L',v:-1/(w*B)});
    let h='';
    sols.forEach((s,i)=>{
      const se=elS(s.X), sh=elP(s.B);
      let tag='Single element';
      if(se&&sh) tag=se.t==='L'&&sh.t==='C'?'Low-pass':se.t==='C'&&sh.t==='L'?'High-pass':se.t+' – '+sh.t;
      const ord=s.sf?'Source, shunt element, series element, load':'Source, series element, shunt element, load';
      let v='';
      if(se) v+=`<div><span>Series ${se.t==='L'?'inductor':'capacitor'}</span><b>${fmtSI(se.v,se.t==='L'?'H':'F')}</b><em>X = ${fmt(s.X)} Ω</em></div>`;
      if(sh) v+=`<div><span>Shunt ${sh.t==='L'?'inductor':'capacitor'}</span><b>${fmtSI(sh.v,sh.t==='L'?'H':'F')}</b><em>B = ${fmt(s.B*1e3)} mS</em></div>`;
      h+=`<div class="sol"><div class="solh"><b>Solution ${i+1}</b><span>${tag}</span></div><div class="solo">${ord}</div>${lmSVG(s.sf,se,sh)}<div class="solv">${v}</div></div>`;
    });
    $('lm_sol').innerHTML=card('Solutions',h||'<p class="note">No solution found for these values.</p>');
    return true;
  }});

/* ---------- 7. Attenuator pad ---------- */
const AT={type:'pi'};
const E96=Array.from({length:96},(_,i)=>Math.round(100*10**(i/96))/100);
function e96(v){ const ex=Math.floor(LOG10(v)); let best=v,bd=Infinity; for(let d=ex-1;d<=ex+1;d++) for(const b of E96){ const c=b*10**d; const df=Math.abs(LOG10(c/v)); if(df<bd){ bd=df; best=c; } } return Number(best.toPrecision(3)); }
const mmul=(a,b)=>[a[0]*b[0]+a[1]*b[2],a[0]*b[1]+a[1]*b[3],a[2]*b[0]+a[3]*b[2],a[2]*b[1]+a[3]*b[3]];
const ser=R=>[1,R,0,1], shn=R=>[1,0,1/R,1];
def('at',{title:'Attenuator Pad',desc:'Pi and T resistor values with E96 picks',cat:'ckt',badge:'A',
  body: card('',
      seg('at_type',[['pi','Pi'],['t','T']])
      + `<div class="dia" id="at_dia"></div>`
      + rows(row('<i>A</i>','Attenuation','at_db',{unit:'dB'}),
             row('<i>Z</i><sub>0</sub>','System impedance','at_z0',{val:'50',unit:'Ω'}))
      + rows(gl('Exact values'),
             row('<i>R</i><sub>1</sub>','Shunt resistors (×2)','at_r1',{out:1,unit:'Ω',nid:'at_n1'}),
             row('<i>R</i><sub>2</sub>','Series resistor','at_r2',{out:1,unit:'Ω',nid:'at_n2'}))
      + rows(gl('Nearest E96 (1 %)'),
             row('<i>R</i><sub>1</sub>','Shunt resistors (×2)','at_e1',{out:1,unit:'Ω',nid:'at_n3'}),
             row('<i>R</i><sub>2</sub>','Series resistor','at_e2',{out:1,unit:'Ω',nid:'at_n4'}),
             row('<i>A</i>','Attenuation with E96','at_att',{out:1,unit:'dB'}),
             row('RL','Return loss with E96','at_rl',{out:1,unit:'dB'}))),
  fx:'K = 10<sup>A/20</sup><br>Pi: R<sub>shunt</sub> = Z₀(K + 1)/(K − 1), R<sub>series</sub> = Z₀(K² − 1)/(2K)<br>T: R<sub>series</sub> = Z₀(K − 1)/(K + 1), R<sub>shunt</sub> = 2K·Z₀/(K² − 1)',
  init(){
    const set=v=>{
      AT.type=v;
      document.querySelectorAll('#at_type button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
      $('at_dia').innerHTML=svgAtt(v);
      const pi=v==='pi', n1=pi?'Shunt resistors (×2)':'Series resistors (×2)', n2=pi?'Series resistor':'Shunt resistor';
      $('at_n1').textContent=n1; $('at_n3').textContent=n1; $('at_n2').textContent=n2; $('at_n4').textContent=n2;
      if(has('at_db')) commit('at',true);
    };
    document.querySelectorAll('#at_type button').forEach(b=>b.addEventListener('click',()=>set(b.dataset.v)));
    set('pi');
  },
  calc(){
    const A=num('at_db'); if(!(A>0)) return 'Attenuation must be greater than 0 dB.';
    const Z=num('at_z0'); if(!(Z>0)) return 'Z₀ must be greater than 0.';
    const K=10**(A/20); let r1,r2;
    if(AT.type==='pi'){ r1=Z*(K+1)/(K-1); r2=Z*(K*K-1)/(2*K); }
    else { r1=Z*(K-1)/(K+1); r2=Z*2*K/(K*K-1); }
    put('at_r1',r1); put('at_r2',r2);
    const e1=e96(r1), e2=e96(r2); put('at_e1',e1); put('at_e2',e2);
    const m=AT.type==='pi'?mmul(mmul(shn(e1),ser(e2)),shn(e1)):mmul(mmul(ser(e1),shn(e2)),ser(e1));
    const den=m[0]+m[1]/Z+m[2]*Z+m[3], s21=2/den, s11=(m[0]+m[1]/Z-m[2]*Z-m[3])/den;
    put('at_att',-20*LOG10(Math.abs(s21))); put('at_rl',Math.abs(s11)<1e-12?Infinity:-20*LOG10(Math.abs(s11)));
    return true;
  }});

def('lc',{title:'LC Resonance',desc:'Solve L, C or f₀ from the other two',cat:'ckt',badge:'LC',
  body: card('Enter any two', rows(

    else { if(!(C>0&&F>0)) return 'C and f₀ must be greater than 0.'; put('lc_L',1/(4*PI*PI*F*F*C)); }
    return true;
  }});

const CS={seq:0};
const fld=(lab,html)=>`<div><span>${lab}</span>${html}</div>`;
function stageHTML(){ const id=++CS.seq; return `<div class="st" data-sid="${id}"><div class="sth"><div class="sn"></div><button type="button" class="sx" aria-label="Remove stage">×</button></div><div class="sg">${fld('Gain, dB',iw('cs_g_'+id,{signed:1}))}${fld('NF, dB',iw('cs_nf_'+id))}${fld('OIP3, dBm',iw('cs_ip_'+id,{signed:1}))}${fld('IP1dB, dBm',iw('cs_p1_'+id,{signed:1}))}</div></div>`; }
function csNum(){ document.querySelectorAll('#cs_stages .st[data-sid] .sn').forEach((e,i)=>e.textContent='Stage '+(i+1)); }
function csAdd(){ $('cs_stages').insertAdjacentHTML('beforeend',stageHTML()); csNum(); }
function csReset(){ document.querySelectorAll('#cs_stages .st[data-sid]').forEach(e=>e.remove()); for(let i=0;i<3;i++) csAdd(); }
def('cs',{title:'Cascade Analysis',desc:'Chain gain, noise figure and IP3',cat:'sys',badge:'Σ',
  body: card('Stages, input to output',
      `<div id="cs_stages"></div><button type="button" class="add" id="cs_add">Add stage</button><p class="note">OIP3 and IP1dB are optional. Leave them empty for passive stages.</p>`)
    + card('Cascade', rows(
      row('<i>G</i>','Total gain','cs_G',{out:1,unit:'dB'}),
      row('NF','Noise figure','cs_NF',{out:1,unit:'dB'}),
      row('<i>T</i><sub>e</sub>','Noise temperature','cs_Te',{out:1,unit:'K'}),
      row('OIP3','Output IP3','cs_oip3',{out:1,unit:'dBm'}),
      row('IIP3','Input IP3','cs_iip3',{out:1,unit:'dBm'}))
    + rows(row('IP1dB','Input P1dB','cs_ip1',{out:1,unit:'dBm'}),
      row('OP1dB','Output P1dB','cs_op1',{out:1,unit:'dBm'}))),
  fx:'F = F₁ + (F₂ − 1)/G₁ + (F₃ − 1)/(G₁G₂) + …<br>1/OIP3 = Σ 1/(OIP3ᵢ·Gᵢ₊₁·…·G<sub>N</sub>)<br>IIP3 = OIP3 − G, T<sub>e</sub> = 290·(F − 1)<br>1/IP1dB = Σ (G₁·…·Gᵢ₋₁)/IP1dBᵢ<br>OP1dB = IP1dB + G − 1 dB',
  init(){
    csReset();
    $('cs_add').addEventListener('click',csAdd);
    $('cs_stages').addEventListener('click',e=>{
      const x=e.target.closest('.sx'); if(!x) return;
      const all=document.querySelectorAll('#cs_stages .st[data-sid]');
      if(all.length<=1) all[0].querySelectorAll('input').forEach(i=>{ i.value=''; i.classList.remove('dirty'); });
      else x.closest('.st').remove();
      csNum();
    });
  },
  clear(){ csReset(); },
  calc(){
    const st=[]; let n=0;
    for(const r of document.querySelectorAll('#cs_stages .st[data-sid]')){
      n++; const id=r.dataset.sid, gi='cs_g_'+id, ni='cs_nf_'+id, pi='cs_ip_'+id, qi='cs_p1_'+id;
      if(!has(gi)&&!has(ni)&&!has(pi)&&!has(qi)) continue;
      const g=num(gi), nf=num(ni);
      if(!isFinite(g)||!isFinite(nf)) return `Stage ${n}: enter both gain and noise figure.`;
      if(nf<0) return `Stage ${n}: noise figure must be 0 dB or greater.`;
      let ip=null; if(has(pi)){ ip=num(pi); if(!isFinite(ip)) return `Stage ${n}: enter a valid OIP3.`; }
      let p1=null; if(has(qi)){ p1=num(qi); if(!isFinite(p1)) return `Stage ${n}: enter a valid IP1dB.`; }
      st.push({g,nf,ip,p1});
    }
    if(!st.length) return 'Enter at least one stage.';
    let F=0, Gl=1, Gdb=0;
    st.forEach((s,i)=>{ const f=10**(s.nf/10); F=i===0?f:F+(f-1)/Gl; Gl*=10**(s.g/10); Gdb+=s.g; });
    put('cs_G',Gdb); put('cs_NF',10*LOG10(F)); put('cs_Te',290*(F-1));
    let inv=0, any=false;
    st.forEach((s,i)=>{ if(s.ip===null) return; any=true; let ga=1; for(let j=i+1;j<st.length;j++) ga*=10**(st[j].g/10); inv+=1/(10**(s.ip/10)*ga); });
    if(any){ const o=10*LOG10(1/inv); put('cs_oip3',o); put('cs_iip3',o-Gdb); } else wipe(['cs_oip3','cs_iip3']);
    let invp=0, anyp=false, gb=1;
    st.forEach(s=>{ if(s.p1!==null){ anyp=true; invp+=gb/10**(s.p1/10); } gb*=10**(s.g/10); });
    if(anyp){ const ip1=10*LOG10(1/invp); put('cs_ip1',ip1); put('cs_op1',ip1+Gdb-1); } else wipe(['cs_ip1','cs_op1']);
    return true;
  }});

def('adc',{title:'ADC Calculator',desc:'SNR, NSD, jitter, processing gain, aliasing',cat:'sys',badge:'N',

      row('SNR<sub>j</sub>','Jitter-limited SNR','adc_snrj',{out:1,unit:'dB'}),
      row('SNR','Quantization and jitter combined','adc_snrt',{out:1,unit:'dB'}),
      row('PG','Processing gain','adc_pg',{out:1,unit:'dB'}),
      row('SNR<sub>BW</sub>','SNR in signal bandwidth','adc_snrbw',{out:1,unit:'dB'}),
      row('ENOB','Effective number of bits','adc_enob',{out:1,unit:'bits'})))
    + card('Sampling', rows(
      row('LSB','LSB size','adc_lsb',{out:1}),
      row('Zone','Nyquist zone','adc_zone',{out:1}),
      row('<i>f</i><sub>alias</sub>','Frequency after sampling','adc_alias',{out:1,dd:'freq',def:1}))),
  fx:'SNR<sub>q</sub> = 6.02·N + 1.76 dB<br>NSD = −SNR<sub>q</sub> − 10·log(f<sub>s</sub>/2)<br>SNR<sub>j</sub> = −20·log(2π·f<sub>in</sub>·t<sub>j</sub>)<br>PG = 10·log(f<sub>s</sub> / 2BW)<br>ENOB = (SINAD − 1.76)/6.02, from combined SNR if SINAD is empty<br>LSB = V<sub>FS</sub> / 2<sup>N</sup>',
  calc(){
    const N=num('adc_n'); if(!(Number.isInteger(N)&&N>=1&&N<=32)) return 'Resolution must be a whole number from 1 to 32.';
    const fs=getSI('adc_fs'); if(!(fs>0)) return 'Enter the sample rate.';
    const snrq=6.02*N+1.76; put('adc_snr',snrq); put('adc_nsd',-snrq-10*LOG10(fs/2));
    let fin=NaN; if(has('adc_fin')){ fin=getSI('adc_fin'); if(!(fin>=0)) return 'Input frequency must be 0 or greater.'; }
    let tj=NaN; if(has('adc_tj')){ tj=getSI('adc_tj'); if(!(tj>0)) return 'Jitter must be greater than 0.'; }
    let snrt=snrq, jit=false;
    if(fin>0&&tj>0){ const sj=-20*LOG10(2*PI*fin*tj); put('adc_snrj',sj); snrt=-10*LOG10(10**(-snrq/10)+10**(-sj/10)); put('adc_snrt',snrt); jit=true; }
    else wipe(['adc_snrj','adc_snrt']);
    if(has('adc_bw')){ const bw=getSI('adc_bw'); if(!(bw>0)) return 'Bandwidth must be greater than 0.'; if(bw>fs/2*1.000001) return 'Bandwidth cannot exceed fs/2.'; const pg=10*LOG10(fs/(2*bw)); put('adc_pg',pg); put('adc_snrbw',snrt+pg); }
    else wipe(['adc_pg','adc_snrbw']);
    if(isFinite(fin)){ $('adc_zone').value=String(Math.floor(fin/(fs/2))+1); put('adc_alias',Math.abs(fin-fs*Math.round(fin/fs))); }
    else wipe(['adc_zone','adc_alias']);
    if(has('adc_vfs')){ const v=num('adc_vfs'); if(!(v>0)) return 'Full-scale voltage must be greater than 0.'; $('adc_lsb').value=fmtSI(v/2**N,'V'); }
    else wipe(['adc_lsb']);
    if(has('adc_sinad')){ const s=num('adc_sinad'); if(!isFinite(s)) return 'Enter a valid SINAD.'; put('adc_enob',(s-1.76)/6.02); }
    else if(jit) put('adc_enob',(snrt-1.76)/6.02);
    else wipe(['adc_enob']);
    return true;
  }});

/* ================= build ================= */
const CATS=[['conv','Conversions','bc'],['ckt','Circuit design','bk'],['sys','System and receiver','bs']];
function tracePath(){
  let d='';
  for(let x=0;x<=600;x+=3){
    const p=x/600, env=0.35+0.65*Math.sin(PI*p);
    const y=60-34*env*Math.sin(2*PI*(2+9*p*p)*p);
    d+=(x?'L':'M')+x+' '+y.toFixed(1);
  }
  return d;
}
function build(){

  CATS.forEach(([k,label,b])=>{

    Object.entries(SC).filter(([,s])=>s.cat===k).forEach(([id,s])=>{
      h+=`<div class="item" data-go="${id}" role="button" tabindex="0"><div class="badge ${b}">${s.badge}</div><div><div class="t">${s.title}</div><div class="d">${s.desc}</div></div><div class="chev">›</div></div>`;

  });
  h+=`<p class="foot">Works offline once installed</p></div></section>`;
  Object.entries(SC).forEach(([id,s])=>{
    h+=`<section class="screen" id="${id}"><header class="bar"><button class="back" type="button" aria-label="Back">‹</button><h1>${s.title}</h1></header><div class="wrap">${s.body}<div class="err" id="err_${id}" role="alert"></div><div class="actions"><button class="btn primary" data-act="calc" type="button">Calculate</button><button class="btn" data-act="clear" type="button">Clear</button></div><p class="hint k">Press <kbd>Enter</kbd> to calculate. <kbd>↑</kbd> <kbd>↓</kbd> step the value, hold <kbd>Shift</kbd> for ×10.</p><p class="hint t">Tap ✓ on the keyboard or Calculate. Use ± for negative values.</p><div class="fx">${s.fx}</div></div></section>`;
  });
  $('app').innerHTML=h;
  document.querySelectorAll('.dd').forEach(initDD);
  Object.values(SC).forEach(s=>s.init&&s.init());
}

/* ================= dropdowns ================= */
function initDD(el){
  const id=el.dataset.for, set=UNITS[el.dataset.units], idx=+el.dataset.def||0;
  UIDX[id]=idx; DDEL[id]=el;
  el.innerHTML=`<button type="button" class="ddb"><span>${set[idx][0]}</span><i>▾</i></button><div class="ddm">${set.map((u,i)=>`<div data-i="${i}"${i===idx?' class="on"':''}>${u[0]}</div>`).join('')}</div>`;
  el.querySelector('.ddb').addEventListener('click',e=>{ e.stopPropagation(); const o=el.classList.contains('open'); closeDD(); if(!o) el.classList.add('open'); });
  el.querySelectorAll('.ddm div').forEach(d=>d.addEventListener('click',e=>{ e.stopPropagation(); setUnit(id,+d.dataset.i); closeDD(); }));
}
function closeDD(){ document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')); }
function setUnit(id,i){
  const el=DDEL[id], set=UNITS[el.dataset.units], v=num(id), old=factor(id);
  UIDX[id]=i;
  if(isFinite(v)) $(id).value=fmt(v*old/set[i][1]);
  el.querySelector('.ddb span').textContent=set[i][0];
  el.querySelectorAll('.ddm div').forEach((d,j)=>d.classList.toggle('on',j===i));
}

/* ================= commit / clear ================= */
const coarse=matchMedia('(pointer: coarse)').matches;
const scOf=el=>{ const s=el.closest('.screen'); return s?s.id:null; };
function commit(sc,silent){
  const s=SC[sc]; if(!s) return;
  let r; try{ r=s.calc(); }catch(err){ console.error(err); r='These inputs could not be calculated. Check the values.'; }
  const e=$('err_'+sc);
  if(r===true){ document.querySelectorAll('#'+sc+' input.dirty').forEach(i=>i.classList.remove('dirty')); e.textContent=''; }
  else if(!silent) e.textContent=r;
}
function clearScreen(sc){
  document.querySelectorAll('#'+sc+' input').forEach(i=>{ i.value=i.dataset.default!=null?i.dataset.default:''; i.classList.remove('dirty','computed'); });
  ORDER[sc]=[]; $('err_'+sc).textContent='';
  if(SC[sc].clear) SC[sc].clear();
}
function markEdit(t){
  t.classList.add('dirty'); t.classList.remove('computed');
  const sc=scOf(t), o=ORDER[sc]||(ORDER[sc]=[]), i=o.indexOf(t.id);
  if(i>=0) o.splice(i,1); o.push(t.id);
  const e=$('err_'+sc); if(e) e.textContent='';
}
function stepVal(inp,dir,big){
  const s=inp.value.trim().replace(/,/g,'.').replace(/−/g,'-');
  let v=s===''?0:Number(s); if(!isFinite(v)) return false;
  const m=s.match(/^[-+]?\d*(?:\.(\d*))?e([-+]?\d+)$/i);
  const dec=(s.split('e')[0].split('.')[1]||'').length;
  let st=m?Math.pow(10,(+m[2])-dec):Math.pow(10,-dec);
  if(big) st*=10;
  v+=dir*st;
  let out=m?fmt(v):v.toFixed(dec);
  if(/^-0(\.0*)?$/.test(out)) out=out.slice(1);
  inp.value=out; return true;
}

/* ================= events ================= */
document.addEventListener('input',e=>{ if(e.target.classList&&e.target.classList.contains('num')) markEdit(e.target); });
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('item')&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); nav(t.dataset.go); return; }
  if(!(t instanceof HTMLInputElement)||!t.classList.contains('num')) return;
  const sc=scOf(t);
  if(e.key==='Enter'){ e.preventDefault(); commit(sc,false); if(coarse) t.blur(); }
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); if(stepVal(t,e.key==='ArrowUp'?1:-1,e.shiftKey)){ markEdit(t); commit(sc,true); } }
});
document.addEventListener('focusout',e=>{ const t=e.target; if(coarse&&t.classList&&t.classList.contains('num')&&t.classList.contains('dirty')) commit(scOf(t),true); });
document.addEventListener('mousedown',e=>{ if(e.target.closest&&e.target.closest('.pm')) e.preventDefault(); });
document.addEventListener('click',e=>{
  const t=e.target;
  const pm=t.closest('.pm');
  if(pm){ const inp=pm.parentElement.querySelector('input'); const s=inp.value.trim(); inp.value=s.startsWith('-')?s.slice(1):'-'+s; markEdit(inp); return; }
  const go=t.closest('[data-go]'); if(go){ nav(go.dataset.go); return; }
  if(t.closest('.back')){ back(); return; }
  const act=t.closest('[data-act]');
  if(act){ const sc=scOf(act); if(act.dataset.act==='calc') commit(sc,false); else clearScreen(sc); return; }
  if(!t.closest('.dd')) closeDD();
});

/* ================= navigation ================= */
let pushed=false;
function nav(id){ pushed=true; location.hash=id; }
function back(){ if(pushed) history.back(); else location.replace('#'); }
function route(){
  const id=location.hash.slice(1), tg=SC[id]?id:'home';
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===tg));
  closeDD(); window.scrollTo(0,0);
  if(tg==='home') pushed=false;
}
addEventListener('hashchange',route);

build(); route();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
